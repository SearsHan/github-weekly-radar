name: Deploy validated Chinese radar to Pages

on:
  push:
    branches: [main]
    paths: [site/data/latest.json]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require ten complete Chinese introductions
        run: python scripts/validate_data.py site/data/latest.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
